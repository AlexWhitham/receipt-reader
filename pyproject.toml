[project]
name = "receipt-reader"
version = "0.2.0"
description = "Read Sainsbury's receipts and upload them to Google Sheets"
requires-python = ">=3.15"
authors = [{ name = "Alexandra Whitham" }]
license = "MIT"
dependencies = [
	"numpy>=2.4.4,<3.0.0",
	"configparser>=7.2.0,<8.0.0",
	"argparse>=1.4.0,<2.0.0",
	"pdf2image>=1.17.0,<2.0.0",
	"google-cloud-vision>=3.13.0,<4.0.0",
	"google-api-python-client>=2.193.0,<3.0.0",
	"google-auth-oauthlib>=1.3.1,<2.0.0",
]

[dependency-groups]
dev = ["black>=26.5.1,<27.0.0", "isort>=9.0,<10.0"]

[tool.uv]
package = false

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "1.0.0"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
